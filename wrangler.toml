# Cloudflare Pages project — static site in ./public, server code in ./functions
name = "stanza"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

[vars]
# "manual": card authorized at checkout, captured after the acceptance gate (≤ 7 days).
# "automatic": charged immediately.
CAPTURE_METHOD = "manual"

# Secrets (never commit them) — set in the Cloudflare dashboard or with:
#   npx wrangler pages secret put STRIPE_SECRET_KEY
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler pages secret put ORDER_NOTIFY_URL   (optional)
#
# Optional order log (KV):
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "<your KV namespace id>"
