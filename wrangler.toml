# Cloudflare Worker — static site in ./public, API routes in ./src/index.js (→ ./functions)
name = "stanza"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# "manual": card authorized at checkout, captured after the acceptance gate (≤ 7 days).
# "automatic": charged immediately.
CAPTURE_METHOD = "manual"

# Secrets (never commit them) — set in the Cloudflare dashboard or with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ORDER_NOTIFY_URL   (optional)
#
# Optional order log (KV):
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "<your KV namespace id>"
